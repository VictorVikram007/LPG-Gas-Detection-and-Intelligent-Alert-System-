<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LPG Gas Monitor</title>
<style>
  :root { --bg:#0f1419; --card:#1a2129; --fg:#e6edf3; --mute:#8b949e; --safe:#2ea043; --warn:#d29922; --danger:#f85149; --line:#30363d; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.4 system-ui,sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:16px; border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; }
  h1 { margin:0; font-size:20px; }
  main { padding:16px; display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); max-width:1200px; margin:auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
  .wide { grid-column:1/-1; }
  .ppm { font-size:64px; font-weight:700; font-variant-numeric:tabular-nums; }
  .status { display:inline-block; padding:6px 14px; border-radius:20px; font-weight:700; letter-spacing:.05em; }
  .SAFE { background:var(--safe); } .WARNING { background:var(--warn); color:#000; } .DANGER { background:var(--danger); }
  body.alarm { animation:flash 1s infinite; }
  @keyframes flash { 50% { background:#3d0d0d; } }
  button, select, input { font:inherit; background:#21262d; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:6px 10px; }
  button { cursor:pointer; } button:hover { border-color:var(--mute); }
  label { display:block; margin:8px 0; color:var(--mute); }
  label input { width:100%; margin-top:4px; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  canvas { width:100%; height:220px; display:block; }
  #log { max-height:220px; overflow:auto; font-family:monospace; font-size:13px; margin:0; padding:0; list-style:none; }
  #log li { padding:3px 0; border-bottom:1px solid var(--line); }
  .mute { color:var(--mute); font-size:13px; }
  .bar { height:10px; background:#21262d; border-radius:5px; overflow:hidden; margin-top:8px; }
  .bar div { height:100%; transition:width .3s, background .3s; }
</style>
</head>
<body>
<header>
  <h1>🔥 LPG Gas Detection &amp; Alert System</h1>
  <div class="row">
    <select id="mode" aria-label="Data source">
      <option value="sim">Simulation</option>
      <option value="serial">Hardware: USB Serial</option>
      <option value="ws">Hardware: WiFi (WebSocket)</option>
    </select>
    <input id="wsUrl" value="ws://192.168.4.1:81" hidden aria-label="WebSocket URL">
    <button id="connect">Start</button>
    <span id="conn" class="mute">Stopped</span>
  </div>
</header>

<main>
  <section class="card">
    <div class="mute">LPG concentration</div>
    <div class="ppm"><span id="ppm">--</span> <small style="font-size:20px">ppm</small></div>
    <span id="status" class="status SAFE">SAFE</span>
    <div class="bar"><div id="bar" style="width:0"></div></div>
    <p class="mute">Peak: <span id="peak">0</span> ppm · Avg (1 min): <span id="avg">0</span> ppm · Trend: <span id="trend">–</span></p>
    <div class="row">
      <button id="ack">Silence alarm</button>
      <button id="notify">Enable notifications</button>
    </div>
  </section>

  <section class="card">
    <strong>Thresholds &amp; calibration</strong>
    <label>Warning at (ppm) <input id="warnTh" type="number" value="300" min="0"></label>
    <label>Danger at (ppm) <input id="dangerTh" type="number" value="1000" min="0"></label>
    <label>Calibration offset (ppm) <input id="offset" type="number" value="0"></label>
    <label>Calibration gain <input id="gain" type="number" value="1" step="0.01" min="0"></label>
    <div id="simCtl">
      <strong>Simulator</strong>
      <div class="row" style="margin-top:8px">
        <button data-sim="leak">Small leak</button>
        <button data-sim="burst">Major leak</button>
        <button data-sim="vent">Ventilate</button>
      </div>
    </div>
  </section>

  <section class="card wide">
    <strong>Live readings (last 2 min)</strong>
    <canvas id="chart"></canvas>
  </section>

  <section class="card wide">
    <div class="row" style="justify-content:space-between">
      <strong>Event log</strong>
      <button id="csv">Export CSV</button>
    </div>
    <ul id="log"></ul>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const HISTORY_S = 120;
let history = [];          // {t, ppm}
let level = 'SAFE', silenced = false, peak = 0, source = null;

// ---------- data sources: each calls onReading(ppm) and returns stop() ----------
function simSource() {
  let base = 40, target = 40;
  const sim = e => {
    const a = e.target.dataset.sim;
    if (a === 'leak') target = 450;
    if (a === 'burst') target = 1800;
    if (a === 'vent') target = 40;
  };
  $('simCtl').addEventListener('click', sim);
  const iv = setInterval(() => {
    base += (target - base) * 0.08;
    onReading(Math.max(0, base + (Math.random() - 0.5) * base * 0.1));
  }, 500);
  return () => { clearInterval(iv); $('simCtl').removeEventListener('click', sim); };
}

// Accepts "523", "ppm:523", or JSON {"ppm":523} per line
function parseLine(line) {
  line = line.trim();
  if (!line) return;
  let v;
  try { v = JSON.parse(line); v = typeof v === 'object' ? v.ppm : v; }
  catch { v = parseFloat(line.replace(/^\D*/, '')); }
  if (Number.isFinite(v)) onReading(v);
}

async function serialSource() {
  if (!('serial' in navigator)) throw new Error('Web Serial not supported — use Chrome or Edge');
  const port = await navigator.serial.requestPort();
  await port.open({ baudRate: 9600 });
  let stopped = false, reader;
  (async () => {
    const dec = port.readable.pipeThrough(new TextDecoderStream());
    reader = dec.getReader();
    let buf = '';
    try {
      while (!stopped) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += value;
        const lines = buf.split('\n'); buf = lines.pop();
        lines.forEach(parseLine);
      }
    } catch (e) { setConn('Serial error: ' + e.message); }
  })();
  return async () => { stopped = true; try { await reader?.cancel(); await port.close(); } catch {} };
}

function wsSource() {
  const ws = new WebSocket($('wsUrl').value);
  ws.onopen = () => setConn('Connected (WiFi)');
  ws.onclose = () => setConn('Disconnected');
  ws.onerror = () => setConn('WebSocket error');
  ws.onmessage = e => String(e.data).split('\n').forEach(parseLine);
  return () => ws.close();
}

// ---------- core ----------
function onReading(raw) {
  const ppm = Math.max(0, raw * +$('gain').value + +$('offset').value);
  const now = Date.now();
  history.push({ t: now, ppm });
  history = history.filter(p => now - p.t <= HISTORY_S * 1000);
  peak = Math.max(peak, ppm);

  const warn = +$('warnTh').value, danger = +$('dangerTh').value;
  const next = ppm >= danger ? 'DANGER' : ppm >= warn ? 'WARNING' : 'SAFE';
  if (next !== level) changeLevel(next, ppm);

  const last60 = history.filter(p => now - p.t <= 60000);
  const avg = last60.reduce((s, p) => s + p.ppm, 0) / last60.length;
  const old = history.find(p => now - p.t <= 10000);
  const delta = old ? ppm - old.ppm : 0;

  $('ppm').textContent = ppm.toFixed(0);
  $('peak').textContent = peak.toFixed(0);
  $('avg').textContent = avg.toFixed(0);
  $('trend').textContent = Math.abs(delta) < 20 ? 'stable' : delta > 0 ? `rising ↑ (+${delta.toFixed(0)}/10s)` : `falling ↓`;
  const pct = Math.min(100, ppm / (danger * 1.5) * 100);
  $('bar').style.width = pct + '%';
  $('bar').style.background = { SAFE: 'var(--safe)', WARNING: 'var(--warn)', DANGER: 'var(--danger)' }[level];
  drawChart(warn, danger);
}

function changeLevel(next, ppm) {
  const rank = { SAFE: 0, WARNING: 1, DANGER: 2 };
  const escalated = rank[next] > rank[level];
  level = next;
  $('status').className = 'status ' + level;
  $('status').textContent = level;
  log(`${level} — ${ppm.toFixed(0)} ppm`);
  if (escalated) {
    silenced = false;
    if (Notification?.permission === 'granted')
      new Notification('LPG ' + level, { body: `Concentration ${ppm.toFixed(0)} ppm. ${level === 'DANGER' ? 'Evacuate, no flames or switches, ventilate!' : 'Check for leaks.'}` });
  }
  updateAlarm();
}

// ---------- alarm (WebAudio beeper) ----------
let audio, beepIv;
function updateAlarm() {
  clearInterval(beepIv);
  document.body.classList.toggle('alarm', level === 'DANGER' && !silenced);
  if (level === 'SAFE' || silenced) return;
  audio ??= new AudioContext();
  const fast = level === 'DANGER';
  beepIv = setInterval(() => {
    const o = audio.createOscillator(), g = audio.createGain();
    o.frequency.value = fast ? 1800 : 900;
    g.gain.value = 0.15;
    o.connect(g).connect(audio.destination);
    o.start(); o.stop(audio.currentTime + 0.2);
  }, fast ? 400 : 1500);
}

// ---------- chart (plain canvas) ----------
function drawChart(warn, danger) {
  const c = $('chart'), dpr = devicePixelRatio || 1;
  const w = c.clientWidth, h = c.clientHeight;
  c.width = w * dpr; c.height = h * dpr;
  const x = c.getContext('2d'); x.scale(dpr, dpr);
  const max = Math.max(danger * 1.3, ...history.map(p => p.ppm));
  const now = Date.now();
  const X = t => w - (now - t) / (HISTORY_S * 1000) * w;
  const Y = v => h - v / max * (h - 10);
  const line = (v, col) => { x.strokeStyle = col; x.setLineDash([5, 5]); x.beginPath(); x.moveTo(0, Y(v)); x.lineTo(w, Y(v)); x.stroke(); x.setLineDash([]); };
  line(warn, '#d29922'); line(danger, '#f85149');
  x.fillStyle = '#8b949e'; x.font = '11px system-ui';
  x.fillText(warn + ' warn', 4, Y(warn) - 4); x.fillText(danger + ' danger', 4, Y(danger) - 4);
  x.strokeStyle = '#58a6ff'; x.lineWidth = 2; x.beginPath();
  history.forEach((p, i) => i ? x.lineTo(X(p.t), Y(p.ppm)) : x.moveTo(X(p.t), Y(p.ppm)));
  x.stroke();
}

// ---------- log / csv ----------
const events = [];
function log(msg) {
  const ts = new Date().toLocaleTimeString();
  events.push([new Date().toISOString(), msg]);
  const li = document.createElement('li');
  li.textContent = `[${ts}] ${msg}`;
  $('log').prepend(li);
}
$('csv').onclick = () => {
  const rows = [['time', 'ppm'], ...history.map(p => [new Date(p.t).toISOString(), p.ppm.toFixed(1)]), [], ['time', 'event'], ...events];
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([rows.map(r => r.join(',')).join('\n')], { type: 'text/csv' }));
  a.download = 'lpg-log.csv'; a.click();
};

// ---------- UI wiring ----------
function setConn(s) { $('conn').textContent = s; }
$('mode').onchange = () => {
  $('wsUrl').hidden = $('mode').value !== 'ws';
  $('simCtl').hidden = $('mode').value !== 'sim';
};
$('connect').onclick = async () => {
  if (source) {
    await source(); source = null;
    $('connect').textContent = 'Start'; setConn('Stopped'); log('Source stopped');
    return;
  }
  try {
    const m = $('mode').value;
    source = await (m === 'sim' ? simSource() : m === 'serial' ? serialSource() : wsSource());
    $('connect').textContent = 'Stop';
    setConn(m === 'sim' ? 'Simulating' : m === 'serial' ? 'Connected (USB)' : 'Connecting…');
    log('Source started: ' + $('mode').selectedOptions[0].text);
  } catch (e) { setConn(e.message); }
};
$('ack').onclick = () => { silenced = true; updateAlarm(); log('Alarm silenced'); };
$('notify').onclick = () => Notification.requestPermission().then(p => log('Notifications: ' + p));
addEventListener('resize', () => drawChart(+$('warnTh').value, +$('dangerTh').value));
</script>
</body>
</html>
